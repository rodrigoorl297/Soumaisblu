<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <script charset="UTF-8" src="../js/base-path.js"></script>
  <script charset="UTF-8" src="../js/db-connect.js?v=1781813000"></script>
  <title>Monitoria de Atendimento · SOU+BLU</title>
  <link rel="icon" href="../images/logo.png" type="image/png" sizes="32x32"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/colors-orange.css"/>
  <link rel="stylesheet" href="../css/leads.css"/>
  <link rel="stylesheet" href="../css/monitoria-atendimento.css?v=2"/>
</head>
<body class="leads-app mon-app">
  <div id="globalLoader" class="loader-overlay">
    <div class="loader-spinner"></div>
    <p class="loader-text">Carregando Monitoria de Atendimento...</p>
  </div>

  <div class="app-layout" id="appLayout" style="display:none;">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon" style="display:flex;align-items:center;justify-content:center;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <div class="logo-text">SOU <span>+ BLU</span></div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Administrativo</div>
        <a class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
          <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
          Dashboard
        </a>
        <a class="nav-item" data-tab="registros" onclick="switchTab('registros')">
          <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
          Registros
        </a>
        <a class="nav-item" data-tab="regras" onclick="switchTab('regras')">
          <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
          Regras
        </a>

        <div class="nav-section-label">Sistema</div>
        <a class="nav-item" onclick="navigateBack()">
          <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>
          Voltar ao Painel
        </a>
        <a class="nav-item" onclick="Auth.logout()">
          <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
          Sair
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="monUserAvatar">?</div>
          <div class="user-info">
            <div class="user-name" id="monUserName">—</div>
            <div class="user-role" id="monUserRole">—</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost btn-sm" onclick="toggleSidebar()" style="display:none;font-size:20px;">☰</button>
          <h1 id="monPageTitle">Dashboard</h1>
        </div>
        <div class="topbar-right">
          <button type="button" class="btn btn-primary btn-sm" onclick="MonitoriaAtendimento.openForm()">+ Nova monitoria</button>
        </div>
      </header>

      <div class="tab-content active page-content" id="monTabRoot"></div>
    </main>
  </div>

  <script charset="UTF-8" src="../js/config.js" defer></script>
  <script charset="UTF-8" src="../js/db.js" defer></script>
  <script charset="UTF-8" src="../js/auth.js?v=1781813000" defer></script>
  <script charset="UTF-8" src="../js/ui.js?v=6" defer></script>
  <script charset="UTF-8" src="../js/monitoria-atendimento.js?v=2" defer></script>
</body>
</html>
