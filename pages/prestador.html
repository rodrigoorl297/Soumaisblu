<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prestador — SOU+BLU</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/provider-portal.css"><script src="../js/finance-access.js" defer></script><script src="../js/provider-portal.js" defer></script></head><body><main style="max-width:1000px;margin:32px auto;padding:20px"><h1>Área do prestador</h1><p id="providerMessage" role="status"></p><form id="providerLogin"><p>Entre com o login vinculado pelo Financeiro.</p><label>ID do usuário <input id="providerUser" autocomplete="username" required></label><label>Senha <input id="providerPassword" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><div id="providerContent" hidden><h2 id="providerName"></h2><button id="providerLogout">Sair</button><h3>Conta corrente</h3><p id="providerBalance"></p><div id="providerStatement"></div><h3>Pagamentos de serviços</h3><div id="providerPayments"></div><h3>Enviar nota fiscal</h3><form id="providerInvoice"><label>Mês <input name="month" type="month" required></label><label>Nota fiscal <input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg" required></label><button>Enviar</button></form><h3>Chamado ao Financeiro</h3><form id="providerTicket"><label>Assunto <input name="subject" maxlength="200" required></label><label>Mensagem <textarea name="message" maxlength="10000" required></textarea></label><button>Abrir chamado</button></form><h3>Notas fiscais e chamados enviados</h3><div id="providerRecords"></div></div></main></body></html>
