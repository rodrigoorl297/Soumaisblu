name: Validar repositorio
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Sintaxe e seguranca
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 tools/validate_repo.py
      - run: python3 tools/check_baseline.py
  unit:
    name: Testes de unidade
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install openpyxl==3.1.5
      - run: python3 -m unittest discover -s tests -p 'test_release.py' -v
      - run: node tests/credit-bank-fields.test.cjs
      - run: node tests/commission-engine.test.cjs
      - run: node tests/proposal-status-filter.test.cjs
      - run: node tests/daily-production-export.test.cjs
